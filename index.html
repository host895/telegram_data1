<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرك البحث في بيانات تليجرام</title>
    
    <!-- سكريبتات إعلانات Popunder و Anti-Adblock (الرأس) -->
    <script data-cfasync="false" src="https://bauval.org/14/d5b53f63b4cb271066fa44c8a4329012"></script>
    <script data-cfasync="false" src="https://abscloud.org/1/3565e08c94b0fc2c6fd90a0c97183c9d"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        .search-box {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0284c7;
            color: #fff;
        }

        .status {
            margin-top: 10px;
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
        }

        .result-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            margin-top: 20px;
            display: none;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .result-value {
            color: #fff;
            font-weight: 600;
            word-break: break-all;
        }

        /* شبكة الإعلانات الكثيفة */
        .ad-banner-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
            overflow: hidden;
            min-height: 60px;
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--border-color);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- إعلان أعلى الصفحة 1 -->
        <div class="ad-banner-container">
            <script>  
              atOptions = {  
                'key' : '9221121f25f3e38fce00544a6e00a8e5',  
                'format' : 'iframe',  
                'height' : 50,  
                'width' : 320,  
                'params' : {}  
              };  
            </script>
            <script src="https://bauval.org/22/9221121f25f3e38fce00544a6e00a8e5"></script>
        </div>

        <div class="header">
            <h1>محرك البحث في قاعدة البيانات</h1>
            <p style="color: var(--text-secondary);">ادخل User ID للبحث عن البيانات الخاصة به</p>
        </div>

        <!-- إعلان 2 -->
        <div class="ad-banner-container">
            <script async="async" data-cfasync="false" src="https://bauval.org/21/092715ad1141e35df7097d05dd0e7368"></script>  
            <div id="container-092715ad1141e35df7097d05dd0e7368"></div>
        </div>

        <div class="search-box">
            <div class="input-group">
                <input type="text" id="userIdInput" placeholder="أدخل User ID هنا (مثال: 111331762)...">
                <button onclick="handleSearchClick()">بحث</button>
            </div>
            <div id="statusText" class="status">جاهز للبحث...</div>
        </div>

        <!-- إعلان 3 (بين البحث والنتائج) -->
        <div class="ad-banner-container">
            <script>  
              atOptions = {  
                'key' : '9221121f25f3e38fce00544a6e00a8e5',  
                'format' : 'iframe',  
                'height' : 50,  
                'width' : 320,  
                'params' : {}  
              };  
            </script>
            <script src="https://bauval.org/22/9221121f25f3e38fce00544a6e00a8e5"></script>
        </div>

        <div id="resultCard" class="result-card">
            <div class="result-item">
                <span class="result-label">الرقم التسلسلي (Index):</span>
                <span id="resIndex" class="result-value">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">الاسم الأول:</span>
                <span id="resFirstName" class="result-value">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">الاسم الأخير:</span>
                <span id="resLastName" class="result-value">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">رقم الهاتف:</span>
                <span id="resPhone" class="result-value">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">User ID:</span>
                <span id="resUserId" class="result-value">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">اسم المستخدم (Username):</span>
                <span id="resUsername" class="result-value">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">آخر ظهور (Was Online):</span>
                <span id="resOnline" class="result-value">-</span>
            </div>
        </div>

        <!-- إعلان أسفل الصفحة 4 -->
        <div class="ad-banner-container">
            <script>  
              atOptions = {  
                'key' : '9221121f25f3e38fce00544a6e00a8e5',  
                'format' : 'iframe',  
                'height' : 50,  
                'width' : 320,  
                'params' : {}  
              };  
            </script>
            <script src="https://bauval.org/22/9221121f25f3e38fce00544a6e00a8e5"></script>
        </div>

        <!-- إعلان أسفل الصفحة 5 -->
        <div class="ad-banner-container">
            <script async="async" data-cfasync="false" src="https://bauval.org/21/092715ad1141e35df7097d05dd0e7368"></script>  
            <div id="container-092715ad1141e35df7097d05dd0e7368"></div>
        </div>

    </div>

    <script>
        // إعدادات المسار ورابط Smartlink
        const baseUrl = 'https://raw.githubusercontent.com/host895/telegram_data1/main/data/';
        const smartLink = 'https://araplhn.org/4/9239b31df6c443e95bbb60160f372a35';
        
        let searchClickCount = 0;

        function handleSearchClick() {
            searchClickCount++;

            // الضغطة الأولى والثانية تفتح رابط الإعلانات الذكي Smartlink
            if (searchClickCount === 1 || searchClickCount === 2) {
                window.open(smartLink, '_blank');
                document.getElementById('statusText').innerText = `يرجى إكمال الإعلان للبحث (المحاولة ${searchClickCount} من 2)...`;
                return;
            }

            // الضغطة الثالثة وما بعدها تنفذ عملية البحث الفعالية
            executeSearch();
        }

        async function executeSearch() {
            const query = document.getElementById('userIdInput').value.trim();
            const statusText = document.getElementById('statusText');
            const resultCard = document.getElementById('resultCard');

            if (!query) {
                statusText.innerText = 'يرجى إدخال User ID أولاً.';
                return;
            }

            statusText.innerText = 'جاري البحث داخل الملفات...';
            resultCard.style.display = 'none';

            let found = false;

            // القراءة بالتوالي من part_1.txt إلى part_100.txt
            for (let i = 1; i <= 100; i++) {
                const fileName = `part_${i}.txt`;
                const fileUrl = `${baseUrl}${fileName}`;

                try {
                    statusText.innerText = `جاري البحث في ${fileName}...`;
                    const response = await fetch(fileUrl);
                    
                    if (!response.ok) continue;

                    const text = await response.text();
                    const lines = text.split('\n');

                    for (let line of lines) {
                        if (!line.trim()) continue;

                        const parts = line.split('|');

                        // التأكد من أن السطر يحتوي على الحقول المطلوبة ويفحص حقل User ID (العنصر الخامس / Index 4)
                        if (parts.length >= 5 && parts[4].trim() === query) {
                            displayResult(parts);
                            found = true;
                            statusText.innerText = `تم العثور على النتائج في ${fileName}!`;
                            break;
                        }
                    }

                    if (found) break;

                } catch (error) {
                    console.error(`خطأ أثناء قراءة ${fileName}:`, error);
                }
            }

            if (!found) {
                statusText.innerText = 'لم يتم العثور على أي بيانات لهذا الرقم (User ID).';
            }
        }

        function displayResult(parts) {
            document.getElementById('resIndex').innerText = parts[0] || 'غير متوفر';
            document.getElementById('resFirstName').innerText = parts[1] || 'غير متوفر';
            document.getElementById('resLastName').innerText = parts[2] || 'غير متوفر';
            document.getElementById('resPhone').innerText = parts[3] || 'غير متوفر';
            document.getElementById('resUserId').innerText = parts[4] || 'غير متوفر';
            document.getElementById('resUsername').innerText = parts[5] || 'غير متوفر';
            
            // تنسيق التاريخ والوقت إذا كان Timestamp متوفراً
            let onlineVal = parts[6] ? parts[6].trim() : '';
            if (onlineVal && !isNaN(onlineVal)) {
                let date = new Date(parseInt(onlineVal));
                onlineVal = date.toLocaleString('ar-EG');
            }
            document.getElementById('resOnline').innerText = onlineVal || 'غير متوفر';

            document.getElementById('resultCard').style.display = 'block';
        }
    </script>
</body>
</html>
