<style>
:root{
  --ink:#0d1a1f; --panel:#13262d; --line:#24404a; --text:#eaf2f0; --muted:#8fa7ad;
  --amber:#f2b84b; --amber-dim:rgba(242,184,75,.14); --ok:#5fd0a0; --danger:#f87171;
}
@media (prefers-color-scheme: light){
  :root{--ink:#f4f1ea;--panel:#fff;--line:#d8d2c4;--text:#17262b;--muted:#5d7176;--amber:#a86a00;--amber-dim:rgba(168,106,0,.1);--ok:#18795a;--danger:#dc2626;}
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{background:var(--ink);color:var(--text);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;line-height:1.7;padding:20px 14px 40px}
.wrap{max-width:720px;margin:0 auto}

header{padding:18px 4px 22px;border-bottom:1px solid var(--line);margin-bottom:18px}
.demo-tag{display:inline-block;font-size:12px;font-weight:600;color:var(--amber);background:var(--amber-dim);padding:2px 12px;border-radius:99px;margin-bottom:12px}
h1{font-size:clamp(28px,7vw,40px);font-weight:700;line-height:1.25;margin-bottom:8px}
header p{color:var(--muted);font-size:15px;max-width:46ch}

.ad-container{display:flex;justify-content:center;align-items:center;margin:16px auto;max-width:100%;overflow:hidden}

.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.stat{padding:14px 8px;text-align:center}
.stat+.stat{border-inline-start:1px solid var(--line)}
.stat strong{display:block;font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;color:var(--amber)}
.stat span{font-size:12.5px;color:var(--muted)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}
.card h2{font-size:17px;font-weight:600;margin-bottom:12px}
.input-group{margin-bottom:14px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input{width:100%;padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--text);font:500 16px 'IBM Plex Mono',monospace;direction:ltr;text-align:left}
input:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.go{width:100%;margin-top:12px;padding:14px;border:0;border-radius:10px;background:var(--amber);color:#1a1405;font:700 16px 'IBM Plex Sans Arabic',sans-serif;cursor:pointer}
.go:active{transform:scale(.99)}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}

.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .k{font-size:13px;color:var(--muted);font-weight:600}
.row .v{display:flex;align-items:center;gap:10px;direction:ltr;font:500 14px 'IBM Plex Mono',monospace;word-break:break-all;color:var(--text)}
.copy{font:600 12px 'IBM Plex Sans Arabic',sans-serif;padding:4px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--amber);cursor:pointer}
.copy.done{color:var(--ok);border-color:var(--ok)}
.sync{font:500 12.5px 'IBM Plex Mono',monospace;color:var(--muted);direction:ltr;text-align:left}
.sync i{color:var(--ok);font-style:normal}
.error-box{color:var(--danger);text-align:center;padding:12px;font-weight:600}

@media (max-width:420px){.stat strong{font-size:17px}.card{padding:16px}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <span class="demo-tag">SECURE TERMINAL v3.7</span>
  <h1>Nexus Lookup</h1>
  <p>محرك استعلامات الأمان والبحث المتقدم عبر المعرفات أو أسماء المستخدمين في قاعدة البيانات.</p>
</header>

<div class="ad-container">
  <script>

    <input id="usernameInput" placeholder="مثال: username">

  <div class="ad-container" style="margin: 14px 0 4px 0;">

      atOptions = {
        'key' : '142c642763a172c51e67562b90e1b87a',

      };
    </script>
    <script src="https://bauval.org/22/142c642763a172c51e67562b90e1b87a"></script>
  </div>

  <button class="go" id="searchBtn" onclick="handleSearchClick()">بدء الاستعلام</button>
  <p class="note" id="statusNote">جاري تحميل وتهيئة قاعدة البيانات...</p>
</section>

<div id="output"></div>

  <script>
    atOptions = {
      'key' : '142c642763a172c51e67562b90e1b87a',
      'format' : 'iframe',
      'height' : 250,

      'params' : {}
    };
  </script>
  <script src="https://bauval.org/22/142c642763a172c51e67562b90e1b87a"></script>
</div>

  <h2>حالة المزامنة</h2>
  <div class="sync" id="logSync"><i>●</i> جاري الاتصال بالمستودع...</div>
</section>

<div class="ad-container">
  <script>
    atOptions = {
      'key' : '9a7cb58b8f728cc9e68161d98e72970b',
      'format' : 'iframe',
      'height' : 90,
      'width' : 728,
      'params' : {}
    };
  </script>
  <script src="https://bauval.org/22/9a7cb58b8f728cc9e68161d98e72970b"></script>
</div>

</div>

<script>
const BASE = "https://raw.githubusercontent.com/host895/telegram_data1/main/data/";
const smartLink = "https://araplhn.org/4/9239b31df6c443e95bbb60160f372a35";

let database = new Map();
let loadedFiles = 0;
let totalRecords = 0;
let searchClickCount = 0;

const $ = id => document.getElementById(id);

function updateStats(){
  $("files").textContent = loadedFiles + "/100";
  $("records").textContent = totalRecords.toLocaleString();
}

function parseLine(line){
  const p = line.split("|");
  if(p.length < 7) return null;
  const id = p[0].trim();
  if(!/^\d+$/.test(id)) return null;
  return {
    id,
    firstName: (p[1] || "").trim(),
    lastName: (p[2] || "").trim(),
    phone: (p[3] || "").trim(),
    accessHash: (p[4] || "").trim(),
    username: (p[5] || "").trim().toLowerCase(),
    originalUsername: (p[5] || "").trim(),
    wasOnline: (p[6] || "").trim()
  };
}

async function loadFile(number){
  const url = BASE + "part_" + number + ".txt";
  try {
    const res = await fetch(url);
    if(!res.ok) return false;
    const text = await res.text();
    const lines = text.split(/\r?\n/);
    let count = 0;
    for(const line of lines){
      const record = parseLine(line);
      if(!record) continue;
      database.set(record.id, record);
      count++;
    }
    totalRecords += count;
    loadedFiles++;
    return true;
  } catch(e){
    return false;
  }
}

async function loadDatabase(){
  $("statusNote").textContent = "جاري جلب وفهرسة الملفات...";

  for(let start = 1; start <= 100; start += 5){
    const batch = [];
    for(let i = start; i < Math.min(start + 5, 101); i++){
      batch.push(loadFile(i));
    }
    await Promise.all(batch);
    updateStats();
    $("logSync").innerHTML = `<i>●</i> تمت فهرسة ${Math.min(start + 4, 100)} من أصل 100 ملف`;
  }

  $("statusNote").textContent = "اكتمل تحميل قاعدة البيانات، النظام جاهز للبحث.";
  $("searchBtn").disabled = false;
  $("logSync").innerHTML = `<i>●</i> اكتمل التحميل بنجاح (${loadedFiles} ملف مفهرس)`;
}

function formatDate(value){
  if(!value || !/^\d+$/.test(value)) return "غير متوفر";
  const d = new Date(Number(value));
  if(isNaN(d.getTime())) return "غير متوفر";
  return d.toLocaleString("ar-EG");
}

function handleSearchClick(){
  searchClickCount++;
  if(searchClickCount === 1 || searchClickCount === 2){
    window.open(smartLink, '_blank');
    $("statusNote").textContent = `يرجى تخطي الإعلان للمتابعة (المحاولة ${searchClickCount} من 2)...`;
    return;
  }
  executeSearch();
}

function executeSearch(){
  let uid = $("userIdInput").value.trim();
  let uname = $("usernameInput").value.trim();
  const output = $("output");

  if(!uid && !uname){
    output.innerHTML = '<section class="card"><div class="error-box">يُرجى إدخال User ID أو Username واحد على الأقل للبحث</div></section>';
    return;
  }

  if(uname.startsWith('@')){
    uname = uname.substring(1);
  }

  let record = null;

  for(let [id, rec] of database.entries()){
    if(uid && rec.id === uid){
      record = rec;
      break;
    }
    if(uname && rec.username === uname.toLowerCase()){
      record = rec;
      break;
    }
  }

  $("matches").textContent = record ? "1" : "0";

  if(!record){
    output.innerHTML = '<section class="card"><div class="error-box">لم يتم العثور على أي تطابق بهذه البيانات في قاعدة البيانات</div></section>';
    $("statusNote").textContent = "لم يتم العثور على نتيجة.";
    return;
  }

  const fullName = [record.firstName, record.lastName].filter(Boolean).join(" ");
  
  let formattedPhone = "غير متوفر";
  if(record.phone){
    formattedPhone = record.phone.startsWith('+') ? record.phone : '+' + record.phone;
  }

  output.innerHTML = `
  <section class="card">
    <h2>نتيجة الاستعلام الدقيق</h2>
    <div class="row"><span class="k">User ID</span><span class="v">${record.id}<button class="copy" type="button">نسخ</button></span></div>
    <div class="row"><span class="k">Full Name</span><span class="v">${fullName || "غير متوفر"}<button class="copy" type="button">نسخ</button></span></div>
    <div class="row"><span class="k">Username</span><span class="v">${record.originalUsername ? "@" + record.originalUsername : "غير متوفر"}<button class="copy" type="button">نسخ</button></span></div>
    <div class="row"><span class="k">Phone Number</span><span class="v">${formattedPhone}<button class="copy" type="button">نسخ</button></span></div>
    <div class="row"><span class="k">Access Hash</span><span class="v">${record.accessHash || "غير متوفر"}<button class="copy" type="button">نسخ</button></span></div>
    <div class="row"><span class="k">Last Online</span><span class="v">${formatDate(record.wasOnline)}<button class="copy" type="button">نسخ</button></span></div>
  </section>`;

  $("statusNote").textContent = "تم جلب البيانات بنجاح.";
}

document.addEventListener('click', e => {
  const b = e.target.closest('.copy');
  if(!b) return;
  const t = b.previousSibling.textContent;
  try { navigator.clipboard.writeText(t); } catch(_) {}
  b.textContent = 'تم النسخ';
  b.classList.add('done');
  setTimeout(() => {
    b.textContent = 'نسخ';
    b.classList.remove('done');
  }, 1500);
});

$("searchBtn").disabled = true;
loadDatabase();
</script>
</body>
