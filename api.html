<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Nexus Telegram API</title>
<style>
  body { background: #ffffff; color: #111111; font-family: monospace; padding: 20px; word-break: break-all; }
  pre { white-space: pre-wrap; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>

<pre id="jsonOutput">جاري التحقق من حالة الاتصال ومعالجة الطلب...</pre>

<script>
const BASE = "https://raw.githubusercontent.com/host895/telegram_data1/main/data/";
const smartLink = "https://araplhn.org/4/9239b31df6c443e95bbb60160f372a35";

let database = new Map();

// قراءة الـ Parameters من الرابط (id أو user)
const urlParams = new URLSearchParams(window.location.search);
const targetId = urlParams.get('id');
const targetUser = urlParams.get('user');

// نظام عداد الطلبات عبر الـ LocalStorage لكل مستخدم/متصفح
let visitCount = parseInt(localStorage.getItem('api_visit_count') || '0') + 1;
localStorage.setItem('api_visit_count', visitCount);

// التحقق من تفعيل الـ Smartlink في أول مرتين، وفي الثالثة وما بعدها يستخرج البيانات
if (visitCount === 1 || visitCount === 2) {
    document.getElementById('jsonOutput').textContent = "جاري توجيهك لصفحة التحقق الإعلانية (المحاولة " + visitCount + " من 2)...";
    setTimeout(() => {
        window.location.href = smartLink;
    }, 1000);
} else {
    // المحاولة الثالثة فما فوق: تحميل الملفات واستخراج البيانات وعرضها بصيغة JSON على صفحة بيضاء
    initAndSearch();
}

function parseLine(line){
  const p = line.split("|");
  if(p.length < 7) return null;
  const id = p[4].trim(); 
  if(!/^\d+$/.test(id)) return null;
  return {
    id,
    firstName: (p[1] || "").trim(),
    lastName: (p[2] || "").trim(),
    phone: (p[3] || "").trim(),
    username: (p[5] || "").trim().toLowerCase(),
    originalUsername: (p[5] || "").trim(),
    wasOnline: (p[6] || "").trim()
  };
}

async function loadFile(number){
  const url = BASE + "part_" + number + ".txt";
  try {
    const res = await fetch(url);
    if(!res.ok) return false;
    const text = await res.text();
    const lines = text.split(/\r?\n/);
    for(const line of lines){
      const record = parseLine(line);
      if(!record) continue;
      database.set(record.id, record);
    }
    return true;
  } catch(e){
    return false;
  }
}

async function initAndSearch(){
  document.getElementById('jsonOutput').textContent = "جاري قراءة قاعدة البيانات واستخراج البيانات المطلوبة...";

  // تحميل سريع لعينات الملفات أو الملفات كاملة (يمكنك تسريع العملية أو تحميلها حسب الحاجة)
  for(let i = 1; i <= 10; i++){ // للتجربة السريعة، أو ارفعها لـ 100 إذا أردت البحث الشامل
    await loadFile(i);
  }

  let record = null;
  if(targetId){
    record = database.get(targetId);
  } else if(targetUser){
    const cleanUser = targetUser.startsWith('@') ? targetUser.substring(1).toLowerCase() : targetUser.toLowerCase();
    for(let [id, rec] of database.entries()){
      if(rec.username === cleanUser){
        record = rec;
        break;
      }
    }
  }

  if(!record){
    document.getElementById('jsonOutput').textContent = JSON.stringify({
      status: false,
      error: "User not found or database still indexing"
    }, null, 2);
    return;
  }

  const fullName = [record.firstName, record.lastName].filter(Boolean).join(" ");
  let formattedPhone = record.phone ? (record.phone.startsWith('+') ? record.phone : '+' + record.phone) : "غير متوفر";

  const responseObj = {
    status: true,
    data: {
      userId: record.id,
      fullName: fullName || "غير متوفر",
      username: record.originalUsername ? "@" + record.originalUsername : "غير متوفر",
      phone: formattedPhone,
      wasOnline: record.wasOnline || "غير متوفر"
    }
  };

  // طباعة النتيجة النهائية كـ JSON نقي على الصفحة البيضاء
  document.getElementById('jsonOutput').textContent = JSON.stringify(responseObj, null, 2);
}
</script>
</body>
</html>
