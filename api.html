<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexus Telegram API</title>
<style>
  body { background: #ffffff; color: #111111; font-family: monospace; padding: 20px; word-break: break-all; }
  pre { white-space: pre-wrap; font-size: 14px; line-height: 1.5; }
  .ad-notice { background: #fff3cd; border: 1px solid #ffeeba; color: #856404; padding: 15px; border-radius: 6px; margin-bottom: 15px; font-family: 'IBM Plex Sans Arabic', sans-serif; }
</style>
</head>
<body>

<div id="noticeContainer"></div>
<pre id="jsonOutput">جاري معالجة طلب الـ API...</pre>

<script>
const BASE = "https://raw.githubusercontent.com/host895/telegram_data1/main/data/";
const smartLink = "https://araplhn.org/4/9239b31df6c443e95bbb60160f372a35";

let database = new Map();

// قراءة المعرف المطلوب من الرابط (?id=... أو ?user=...)
const urlParams = new URLSearchParams(window.location.search);
const targetId = urlParams.get('id');
const targetUser = urlParams.get('user');

if (!targetId && !targetUser) {
    document.getElementById('jsonOutput').textContent = JSON.stringify({
        status: false,
        error: "Please provide ?id= or ?user= parameter"
    }, null, 2);
} else {
    // إنشاء مفتاح فريد لكل شخص يتم البحث عنه في التخزين المحلي للمستخدم
    const searchKey = `api_clicks_${targetId || targetUser}`;
    let currentClicks = parseInt(localStorage.getItem(searchKey) || '0') + 1;
    localStorage.setItem(searchKey, currentClicks);

    // نظام الإعلانات المتكرر: أول مرتين لكل شخص جديد تفتح إعلان Smartlink
    if (currentClicks === 1 || currentClicks === 2) {
        document.getElementById('noticeContainer').innerHTML = `
            <div class="ad-notice">
              <strong>تنبيه إعلاني:</strong> هذه هي المحاولة (${currentClicks} من 2) لجلب بيانات هذا المستخدم. جاري تحويلك للإعلان...
            </div>
        `;
        document.getElementById('jsonOutput').textContent = "جاري توجيهك لصفحة الإعلان...";
        
        setTimeout(() => {
            window.location.href = smartLink;
        }, 1500);
    } else {
        // المحاولة الثالثة فما فوق: جلب بيانات الشخص وعرضها كـ JSON صافي
        initAndSearch(targetId, targetUser);
    }
}

function parseLine(line){
  const p = line.split("|");
  if(p.length < 7) return null;
  const id = p[4].trim(); 
  if(!/^\d+$/.test(id)) return null;
  return {
    id,
    firstName: (p[1] || "").trim(),
    lastName: (p[2] || "").trim(),
    phone: (p[3] || "").trim(),
    username: (p[5] || "").trim().toLowerCase(),
    originalUsername: (p[5] || "").trim(),
    wasOnline: (p[6] || "").trim()
  };
}

async function loadFile(number){
  const url = BASE + "part_" + number + ".txt";
  try {
    const res = await fetch(url);
    if(!res.ok) return false;
    const text = await res.text();
    const lines = text.split(/\r?\n/);
    for(const line of lines){
      const record = parseLine(line);
      if(!record) continue;
      database.set(record.id, record);
    }
    return true;
  } catch(e){
    return false;
  }
}

async function initAndSearch(uid, uname){
  document.getElementById('jsonOutput').textContent = "جاري البحث في قاعدة البيانات...";

  // تحميل الملفات (يمكنك تعديل عدد الملفات حسب رغبتك أو جعلها تصل إلى 100)
  for(let i = 1; i <= 20; i++){
    await loadFile(i);
  }

  let record = null;
  if(uid){
    record = database.get(uid);
  } else if(uname){
    const cleanUser = uname.startsWith('@') ? uname.substring(1).toLowerCase() : uname.toLowerCase();
    for(let [id, rec] of database.entries()){
      if(rec.username === cleanUser){
        record = rec;
        break;
      }
    }
  }

  if(!record){
    document.getElementById('jsonOutput').textContent = JSON.stringify({
      status: false,
      error: "User not found"
    }, null, 2);
    return;
  }

  const fullName = [record.firstName, record.lastName].filter(Boolean).join(" ");
  let formattedPhone = record.phone ? (record.phone.startsWith('+') ? record.phone : '+' + record.phone) : "غير متوفر";

  const responseObj = {
    status: true,
    data: {
      userId: record.id,
      fullName: fullName || "غير متوفر",
      username: record.originalUsername ? "@" + record.originalUsername : "غير متوفر",
      phone: formattedPhone,
      wasOnline: record.wasOnline || "غير متوفر"
    }
  };

  // إظهار كود الـ JSON النقي
  document.getElementById('jsonOutput').textContent = JSON.stringify(responseObj, null, 2);
}
</script>
</body>
</html>
